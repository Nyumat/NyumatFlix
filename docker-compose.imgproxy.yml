services:
  imgproxy:
    image: darthsim/imgproxy:latest
    container_name: nyumatflix-imgproxy
    restart: unless-stopped
    environment:
      IMGPROXY_BIND: ":8081"
      IMGPROXY_ALLOWED_SOURCES: https://image.tmdb.org/,https://s4.anilist.co/,https://media.kitsu.app/,https://img.youtube.com/,https://nyumatflix.com/,https://www.nyumatflix.com/
      IMGPROXY_ENABLE_AVIF_DETECTION: "true"
      IMGPROXY_ENABLE_WEBP_DETECTION: "true"
      IMGPROXY_MAX_SRC_RESOLUTION: 50
    ports:
      - "127.0.0.1:9081:8081"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8081 && printf \"GET /health HTTP/1.0\\r\\n\\r\\n\" >&3 && head -1 <&3 | grep -q \"200\"'",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - betterome

networks:
  betterome:
    external: true
