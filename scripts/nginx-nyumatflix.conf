# ── nyumatflix.com HTTP → HTTPS redirect ──
server {
    listen 80;
    listen [::]:80;
    server_name nyumatflix.com www.nyumatflix.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── nyumatflix.com HTTPS ──
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nyumatflix.com www.nyumatflix.com;

    ssl_certificate /etc/letsencrypt/live/nyumatflix.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nyumatflix.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_header_timeout 15s;
    client_body_timeout 15s;
    keepalive_timeout 30s;
    send_timeout 60s;

    # Block aggressive crawlers / AI scraping bots
    if ($bad_bot) {
        return 403;
    }

    location = /_crowdsec_auth {
        internal;
        proxy_pass http://127.0.0.1:7443/api/v1/forwardAuth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
    }

    location ^~ /_next/static/ {
        proxy_pass http://nyumatflix_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_buffering on;
        proxy_cache nyumatflix_static;
        proxy_cache_lock on;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Timing-Allow-Origin "*" always;
        add_header X-NyumatFlix-Cache $upstream_cache_status always;
    }

    location ^~ /img/ {
        proxy_pass http://nyumatflix_imgproxy/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering on;
        proxy_cache nyumatflix_static;
        proxy_cache_lock on;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Timing-Allow-Origin "*" always;
        add_header X-NyumatFlix-Cache $upstream_cache_status always;
    }

    location ~* ^/(movie-banner\.webp|favicon\.ico|icon\.png|apple-touch-icon(?:-120x120)?\.png|movi-player-sw\.js)$ {
        proxy_pass http://nyumatflix_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_buffering on;
        proxy_cache nyumatflix_static;
        proxy_cache_lock on;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Timing-Allow-Origin "*" always;
        add_header X-NyumatFlix-Cache $upstream_cache_status always;
    }

    location ^~ /api/site/ {
        proxy_pass http://nyumatflix_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        proxy_buffering on;
        proxy_cache nyumatflix_static;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_valid 200 30s;
        proxy_cache_lock on;
        add_header X-NyumatFlix-Cache $upstream_cache_status always;
    }

    location = /api/servers/health {
        proxy_pass http://nyumatflix_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        proxy_buffering on;
    }

    # Liveness — short timeouts, no middleware; must stay fast under scrape load.
    location = /api/healthz {
        proxy_pass http://nyumatflix_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        proxy_send_timeout 5s;
        proxy_buffering off;
    }

    location ^~ /api/scrape/play/ {
        proxy_pass http://nyumatflix_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        proxy_buffering off;
    }

    location ^~ /api/live/play/ {
        proxy_pass http://nyumatflix_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        proxy_buffering off;
    }

    # calluspirates media/transcode — Range seeks need unbuffered streaming and
    # long timeouts (MediaFlow playlist can take minutes on large remuxes).
    location ^~ /api/direct/ {
        proxy_pass http://nyumatflix_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # nextauth — skip crowdsec so magic-link clicks are not blocked
    location ^~ /api/auth/ {
        proxy_pass http://nyumatflix_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $nyumatflix_connection_upgrade;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering on;
    }

    # standard API routes — never cached, normal timeouts
    location ^~ /api/ {
        proxy_pass http://nyumatflix_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $nyumatflix_connection_upgrade;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering on;
    }

    # expensive SSR / crawler targets that previously drove memory pressure
    location ~ ^/(movies|tvshows|anime|person)/[^/]+/opengraph-image {
        proxy_pass http://nyumatflix_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_buffering on;

        proxy_cache nyumatflix_ssr;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_ignore_headers Cache-Control Expires;
        proxy_cache_valid 200 1h;
        proxy_cache_valid 404 1m;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-NyumatFlix-Cache $upstream_cache_status always;
    }

    # Media detail pages — longer microcache for RSC navigation
    location ~ ^/(movies|tvshows)/[^/]+$ {
        proxy_pass http://nyumatflix_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering on;

        proxy_cache nyumatflix_ssr;
        proxy_cache_key "$scheme$request_method$host$request_uri$http_rsc";
        proxy_cache_bypass $ssr_bypass;
        proxy_no_cache $ssr_bypass;
        proxy_ignore_headers Cache-Control Expires;
        proxy_cache_valid 200 1h;
        proxy_cache_valid 404 60s;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-NyumatFlix-Cache $upstream_cache_status always;
    }

    location ~ ^/person/ {
        proxy_pass http://nyumatflix_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $nyumatflix_connection_upgrade;
        proxy_read_timeout 45s;
        proxy_send_timeout 45s;
        proxy_buffering on;

        proxy_cache nyumatflix_ssr;
        proxy_cache_key "$scheme$request_method$host$request_uri$http_rsc";
        proxy_cache_bypass $ssr_bypass;
        proxy_no_cache $ssr_bypass;
        proxy_ignore_headers Cache-Control Expires;
        proxy_cache_valid 200 300s;
        proxy_cache_valid 404 60s;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-NyumatFlix-Cache $upstream_cache_status always;
    }

    location / {
        proxy_pass http://nyumatflix_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $nyumatflix_connection_upgrade;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering on;

        proxy_cache nyumatflix_ssr;
        proxy_cache_key "$scheme$request_method$host$request_uri$http_rsc";
        proxy_cache_bypass $ssr_bypass;
        proxy_no_cache $ssr_bypass;
        proxy_ignore_headers Cache-Control Expires;
        proxy_cache_valid 200 300s;
        proxy_cache_valid 404 60s;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-NyumatFlix-Cache $upstream_cache_status always;
    }
}
