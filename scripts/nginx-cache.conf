# NyumatFlix nginx cache zones and catalog API caching.
# Include from nginx http {} context (e.g. /etc/nginx/conf.d/nyumatflix-cache.conf).

proxy_cache_path /var/cache/nginx/nyumatflix-api
    levels=1:2
    keys_zone=nyumatflix_api_cache:50m
    max_size=1g
    inactive=24h
    use_temp_path=off;

