services:
  gluetun:
    image: ${GLUETUN_IMAGE:-qmcgaw/gluetun:v3.41.3}
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HTTPPROXY: "on"
      HTTPPROXY_LOG: "off"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- --timeout=8 --header=\"X-API-Key: $$GLUETUN_CONTROL_API_KEY\" http://127.0.0.1:8000/v1/vpn/status | grep -q '\"status\":\"running\"'",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks:
      - betterome

networks:
  betterome:
    external: true
