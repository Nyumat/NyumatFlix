# ── cdn.nyumatflix.com HTTP → HTTPS redirect ──
server {
    listen 80;
    listen [::]:80;
    server_name cdn.nyumatflix.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── cdn.nyumatflix.com HTTPS (static assets + imgproxy) ──
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cdn.nyumatflix.com;

    ssl_certificate /etc/letsencrypt/live/cdn.nyumatflix.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cdn.nyumatflix.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_header_timeout 15s;
    client_body_timeout 15s;
    keepalive_timeout 30s;
    send_timeout 60s;

    location ^~ /_next/static/ {
        proxy_pass http://nyumatflix_app;
        proxy_http_version 1.1;
        proxy_set_header Host nyumatflix.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_buffering on;
        proxy_cache nyumatflix_static;
        proxy_cache_lock on;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Timing-Allow-Origin "*" always;
        add_header X-NyumatFlix-Cache $upstream_cache_status always;
    }

    location ^~ /img/ {
        proxy_pass http://nyumatflix_imgproxy/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering on;
        proxy_cache nyumatflix_static;
        proxy_cache_lock on;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Timing-Allow-Origin "*" always;
        add_header X-NyumatFlix-Cache $upstream_cache_status always;
    }

    location ~* ^/(movie-banner\.webp|favicon\.ico|icon\.png|apple-touch-icon(?:-120x120)?\.png|movi-player-sw\.js)$ {
        proxy_pass http://nyumatflix_app;
        proxy_http_version 1.1;
        proxy_set_header Host nyumatflix.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_buffering on;
        proxy_cache nyumatflix_static;
        proxy_cache_lock on;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Timing-Allow-Origin "*" always;
        add_header X-NyumatFlix-Cache $upstream_cache_status always;
    }

    location / {
        return 404;
    }
}
