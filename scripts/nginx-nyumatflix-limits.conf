# Loaded from /etc/nginx/conf.d inside nginx's http context.
map $http_upgrade $nyumatflix_connection_upgrade {
    default upgrade;
    '' close;
}

# Block aggressive AI crawlers, scraper bots, and abusive agents
map $http_user_agent $bad_bot {
    default 0;
    ~*(meta-externalagent|facebookexternalhit|Lightpanda|Bytespider|GPTBot|ChatGPT-User|ClaudeBot|Claude-Web|Amazonbot|CCBot|PerplexityBot|anthropic-ai|cohere-ai|Seekport|MJ12bot|AhrefsBot|SemrushBot|DotBot|BLEXBot|DataForSeoBot) 1;
}

# SSR microcache bypass: personalized routes and non-GET only (logged-in users still cache catalog/detail)
map $request_uri $ssr_uri_bypass {
    default 0;
    ~^/api/ 1;
    ~^/login 1;
    ~^/watchlist 1;
}

map $request_method $ssr_method_bypass {
    GET 0;
    HEAD 0;
    default 1;
}

map "$ssr_uri_bypass:$ssr_method_bypass" $ssr_bypass {
    "0:0" 0;
    default 1;
}

proxy_cache_path /var/cache/nginx/nyumatflix
    levels=1:2
    keys_zone=nyumatflix_static:50m
    max_size=2g
    inactive=7d
    use_temp_path=off;

proxy_cache_path /var/cache/nginx/nyumatflix_ssr
    levels=1:2
    keys_zone=nyumatflix_ssr:20m
    max_size=512m
    inactive=10m
    use_temp_path=off;
