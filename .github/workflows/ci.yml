name: CI

env:
  HUSKY: 0
  APP_URL: https://nyumatflix.com
  AUTH_URL: https://nyumatflix.com
  NEXTAUTH_URL: https://nyumatflix.com
  FLARESOLVERR_URL: http://flaresolverr:8191/v1
  SCRAPE_PROXY_URL: http://gluetun:8888
  SCRAPE_VPN_CONTROL_URL: http://gluetun:8000
  SCRAPE_VPN_ROTATE_COUNTRIES: Germany,Netherlands,France,United States
  FLIPT_URL: http://flipt:8080
  FLIPT_ENVIRONMENT: default
  FLIPT_NAMESPACE: default

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      NEXT_PUBLIC_TMDB_API_KEY: ${{ secrets.NEXT_PUBLIC_TMDB_API_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      AUTH_RESEND_KEY: ${{ secrets.AUTH_RESEND_KEY }}
      ID_MOE_API_KEY: ${{ secrets.ID_MOE_API_KEY }}
      FLIPT_API_TOKEN: ${{ secrets.FLIPT_API_TOKEN }}
      SCRAPE_VPN_CONTROL_API_KEY: ${{ secrets.SCRAPE_VPN_CONTROL_API_KEY }}
      SCRAPE_VPN_ROTATE_SECRET: ${{ secrets.SCRAPE_VPN_ROTATE_SECRET }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Restore Bun, Turbo, and Turbopack caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            ${{ github.workspace }}/.turbo
            ${{ github.workspace }}/apps/web/.next/cache
          key: ${{ runner.os }}-nyumatflix-${{ hashFiles('bun.lock', 'turbo.json', 'apps/web/next.config.mjs') }}
          restore-keys: |
            ${{ runner.os }}-nyumatflix-${{ hashFiles('bun.lock', 'turbo.json', 'apps/web/next.config.mjs') }}-
            ${{ runner.os }}-nyumatflix-

      - name: Install dependencies
        run: bun install --ignore-scripts

      - name: Create .env.local for CI
        run: |
          cat > apps/web/.env.local <<EOF
          TMDB_API_KEY=${TMDB_API_KEY}
          NEXT_PUBLIC_TMDB_API_KEY=${NEXT_PUBLIC_TMDB_API_KEY}
          DATABASE_URL=${DATABASE_URL}
          PROD_DATABASE_URL=${PROD_DATABASE_URL}
          AUTH_SECRET=${AUTH_SECRET}
          AUTH_RESEND_KEY=${AUTH_RESEND_KEY}
          ID_MOE_API_KEY=${ID_MOE_API_KEY}
          APP_URL=${APP_URL}
          AUTH_URL=${AUTH_URL}
          NEXTAUTH_URL=${NEXTAUTH_URL}
          FLARESOLVERR_URL=${FLARESOLVERR_URL}
          SCRAPE_PROXY_URL=${SCRAPE_PROXY_URL}
          SCRAPE_VPN_CONTROL_URL=${SCRAPE_VPN_CONTROL_URL}
          SCRAPE_VPN_CONTROL_API_KEY=${SCRAPE_VPN_CONTROL_API_KEY}
          SCRAPE_VPN_ROTATE_SECRET=${SCRAPE_VPN_ROTATE_SECRET}
          SCRAPE_VPN_ROTATE_COUNTRIES=${SCRAPE_VPN_ROTATE_COUNTRIES}
          FLIPT_URL=${FLIPT_URL}
          FLIPT_ENVIRONMENT=${FLIPT_ENVIRONMENT}
          FLIPT_NAMESPACE=${FLIPT_NAMESPACE}
          FLIPT_API_TOKEN=${FLIPT_API_TOKEN}
          EOF

      - name: Restore player WASM
        id: player-wasm
        uses: actions/cache/restore@v4
        with:
          path: packages/player/dist/wasm
          key: ${{ runner.os }}-player-wasm-${{ hashFiles('packages/player/wasm/**', 'packages/player/docker/**', 'packages/player/compose.yaml') }}

      - name: Build WASM and app
        if: github.event_name == 'push'
        env:
          NODE_ENV: production
        run: |
          if [[ "${{ steps.player-wasm.outputs.cache-hit }}" != "true" ]]; then
            bunx turbo build:wasm --filter=@nyumatflix/player
          else
            echo "player wasm unchanged — using cached packages/player/dist/wasm"
          fi
          bunx turbo build --filter=@nyumatflix/web...

      - name: Save player WASM
        if: success() && github.event_name == 'push' && steps.player-wasm.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: packages/player/dist/wasm
          key: ${{ runner.os }}-player-wasm-${{ hashFiles('packages/player/wasm/**', 'packages/player/docker/**', 'packages/player/compose.yaml') }}

      - name: Check formatting
        run: bunx turbo check-format --filter=@nyumatflix/web

      - name: Run lint
        run: bunx turbo lint --filter=@nyumatflix/web...

      - name: Type check
        run: bunx turbo typecheck --filter=@nyumatflix/web...

      - name: Prepare anime mappings
        working-directory: apps/web
        run: bun run prepare-anime-mappings

      - name: Run tests
        env:
          NODE_ENV: test
        run: bunx turbo test --filter=@nyumatflix/web...

  build-push:
    runs-on: ubuntu-latest
    needs: ci
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository)
    env:
      DOCKER_REPOSITORY: whotypes/nyumatflix
      DOCKER_PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Restore player WASM
        id: player-wasm
        uses: actions/cache/restore@v4
        with:
          path: packages/player/dist/wasm
          key: ${{ runner.os }}-player-wasm-${{ hashFiles('packages/player/wasm/**', 'packages/player/docker/**', 'packages/player/compose.yaml') }}

      - name: Set up Bun
        if: steps.player-wasm.outputs.cache-hit != 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Restore Turbo cache
        if: steps.player-wasm.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.bun/install/cache
            ${{ github.workspace }}/.turbo
          key: ${{ runner.os }}-nyumatflix-${{ hashFiles('bun.lock', 'turbo.json', 'apps/web/next.config.mjs') }}
          restore-keys: |
            ${{ runner.os }}-nyumatflix-${{ hashFiles('bun.lock', 'turbo.json', 'apps/web/next.config.mjs') }}-
            ${{ runner.os }}-nyumatflix-

      - name: Install dependencies
        if: steps.player-wasm.outputs.cache-hit != 'true'
        run: bun install --ignore-scripts

      - name: Note image publish mode
        run: |
          if [[ "$DOCKER_PUSH" == "true" ]]; then
            echo "building image for push"
          else
            echo "dry run: building image without pushing to the registry"
          fi
          if [[ "${{ steps.player-wasm.outputs.cache-hit }}" == "true" ]]; then
            echo "player wasm unchanged — using cached packages/player/dist/wasm"
          fi

      - name: Build WASM for Docker image
        if: steps.player-wasm.outputs.cache-hit != 'true'
        run: bunx turbo build:wasm --filter=@nyumatflix/player

      - name: Save player WASM
        if: success() && steps.player-wasm.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: packages/player/dist/wasm
          key: ${{ runner.os }}-player-wasm-${{ hashFiles('packages/player/wasm/**', 'packages/player/docker/**', 'packages/player/compose.yaml') }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: ${{ env.DOCKER_PUSH == 'true' }}
          build-args: |
            TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}
            CAP_API_ENDPOINT=${{ secrets.CAP_API_ENDPOINT }}
          tags: |
            ${{ env.DOCKER_REPOSITORY }}:${{ github.sha }}
            ${{ env.DOCKER_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: [ci, build-push]
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository)
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('nyumatflix-pr-{0}', github.event.pull_request.number) || 'nyumatflix-production' }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/home/whotypes/apps/nyumatflix' }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      DOCKER_IMAGE: whotypes/nyumatflix:${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Check deploy inputs
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          set -euo pipefail
          [[ -n "$DEPLOY_HOST" ]] || { echo "DEPLOY_HOST is empty" >&2; exit 1; }
          [[ -n "$DEPLOY_USER" ]] || { echo "DEPLOY_USER is empty" >&2; exit 1; }
          [[ -n "$DEPLOY_SSH_PRIVATE_KEY" ]] || { echo "DEPLOY_SSH_PRIVATE_KEY is empty" >&2; exit 1; }
          [[ -n "$PROD_DATABASE_URL" ]] || { echo "PROD_DATABASE_URL is empty" >&2; exit 1; }
          [[ -n "$DEPLOY_PATH" ]] || { echo "DEPLOY_PATH is empty" >&2; exit 1; }
          [[ -n "$DEPLOY_PORT" ]] || { echo "DEPLOY_PORT is empty" >&2; exit 1; }
          required=(
            scripts/deploy.sh
            scripts/deploy-lib.sh
            scripts/reconcile-prod-infra.sh
            scripts/db-migrate-if-needed.sh
            scripts/bunny-purge-catalog.sh
            scripts/infra-health.sh
          )
          for script in "${required[@]}"; do
            [[ -f "$script" ]] || { echo "missing $script" >&2; exit 1; }
            bash -n "$script"
          done

      - name: Set up Bun
        if: github.event_name == 'push'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        if: github.event_name == 'push'
        run: bun install --ignore-scripts

      - name: Sync production database
        if: github.event_name == 'push'
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: ./scripts/db-migrate-if-needed.sh

      - name: Set up SSH key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Dry-run deploy
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          ssh -p "$DEPLOY_PORT" -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" "printf '%s\n' 'deploy dry run: ssh ok'"
          echo "would migrate the production database"
          echo "would sync deploy files to ${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}"
          echo "would deploy ${DOCKER_IMAGE}"
          echo "skipped migration, file sync, and container switch"

      - name: Sync deploy files
        if: github.event_name == 'push'
        run: |
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH/infra' '$DEPLOY_PATH/scripts'"
          rsync -avz -e "ssh -p $DEPLOY_PORT" \
            infra/docker-compose.scrape.yml infra/docker-compose.ffs.yml infra/docker-compose.imgproxy.yml \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/infra/"
          rsync -avz -e "ssh -p $DEPLOY_PORT" \
            scripts/deploy.sh scripts/deploy-lib.sh scripts/reconcile-prod-infra.sh scripts/db-migrate-if-needed.sh scripts/bunny-purge-catalog.sh \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/scripts/"
          if [[ -d flipt ]]; then
            rsync -avz -e "ssh -p $DEPLOY_PORT" \
              flipt/ \
              "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/flipt/"
          fi

      - name: Deploy latest image
        if: github.event_name == 'push'
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          COMMIT_MSG=$(printf '%s' "$COMMIT_MESSAGE" | head -1 | sed "s/'/'\\\\''/g")
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" <<EOF
          set -euo pipefail
          export NYUMATFLIX_ROOT="$DEPLOY_PATH"
          export DOCKER_IMAGE="$DOCKER_IMAGE"
          export DEPLOY_SHA="${{ github.sha }}"
          export DEPLOY_SHORT_SHA="\${DEPLOY_SHA:0:7}"
          export DEPLOY_MESSAGE='$COMMIT_MSG'
          export DEPLOY_AUTHOR="${{ github.actor }}"
          export DEPLOY_SOURCE="ci"
          "$DEPLOY_PATH/scripts/deploy.sh" serve
          EOF
