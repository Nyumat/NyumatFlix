services:
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    restart: unless-stopped
    env_file:
      - ${GLUETUN_ENV_FILE:-./scripts/gluetun/.env}
    environment:
      HTTPPROXY: "on"
      HTTPPROXY_LOG: "off"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- --timeout=5 --header=\"X-API-Key: $$GLUETUN_CONTROL_API_KEY\" http://127.0.0.1:8000/v1/vpn/status | grep -q '\"status\":\"running\"' && wget -qO- --timeout=5 --header=\"X-API-Key: $$GLUETUN_CONTROL_API_KEY\" http://127.0.0.1:8000/v1/publicip/ip | grep -qE '\"public_ip\":\"[^\"]+'",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - betterome

  flaresolverr:
    image: flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8191/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      LOG_LEVEL: ${FLARESOLVERR_LOG_LEVEL:-info}
      CAPTCHA_SOLVER: ${FLARESOLVERR_CAPTCHA_SOLVER:-none}
      PROXY_URL: http://gluetun:8888
    networks:
      - betterome
    depends_on:
      gluetun:
        condition: service_healthy

networks:
  betterome:
    external: true
